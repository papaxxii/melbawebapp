<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - E&amp;M'z Snacks</title>
  <link rel="stylesheet" href="assets/css/bundle.css">
</head>
<body>
  <div class="container my-4">
    <h1>Admin</h1>
    <p><button id="admin-logout" class="btn btn-secondary">Sign out</button></p>

    <section>
      <h2>Products</h2>
      <p><button id="add-product-btn" class="btn btn-primary">Add product</button></p>
      <div id="products-list">Loading products...</div>
    </section>

    <section class="mt-4">
      <h2>Orders</h2>
      <div id="orders-list">Loading orders...</div>
    </section>

    <div id="product-modal" class="hidden modal-overlay" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true">
        <h3>New product</h3>
        <form id="product-form">
          <div class="form-group"><label>Title</label><input name="title" class="form-control" required></div>
          <div class="form-group"><label>Price</label><input name="price" class="form-control" type="number" step="0.01"></div>
          <div class="form-group"><label>Availability</label><input name="availability" class="form-control" type="number" step="0.01"></div>
          <div class="form-group"><label>Category</label><input name="category" class="form-control" placeholder="eg. burger, fries"></div>
          <div class="form-group"><label>Description</label><textarea name="desc" class="form-control"></textarea></div>
          <div class="form-group"><label>Image</label><input name="image" type="file" class="form-control"></div>
          <div class="mt-2"><button type="submit" class="btn btn-primary">Save</button> <button type="button" id="close-product-modal" class="btn btn-secondary">Close</button></div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAdmin } from './js/admin.js';
    initAdmin();
  </script>
</body>
</html>
